name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-code:
    name: Generated code and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check out merged website CSV contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Satsrag/satsrag.github.io
          ref: 0b50ba5b9f5c0ee66040ce6e8f343230b8832513
          path: website-contract
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Verify merged website CSVs are direct generator inputs
        run: >-
          python3 scripts/check_website_contract.py
          --website-root website-contract
          --website-ref HEAD

      - name: Regenerate Rust sources
        run: python3 scripts/generate_zvvnmod.py

      - name: Upload GitHub-generated Rust sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-rust-${{ github.sha }}
          path: src/generated/*.rs
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated sources are current
        shell: bash
        run: |
          git diff --exit-code -- src/generated
          test -z "$(git status --porcelain --untracked-files=all -- src/generated)"

  rust:
    name: Rust tests and quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  mongol-norm-command:
    name: External mongol-norm command bridge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install and verify mongol-norm
        run: scripts/install_mongol_norm.sh

      - name: Run external command bridge tests
        run: cargo test --test command_bridge --test command_cli -- --ignored
