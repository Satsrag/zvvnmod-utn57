name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-code:
    name: Generated code and Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -v

      - name: Regenerate Rust sources
        run: python3 scripts/generate_zvvnmod.py

      - name: Upload GitHub-generated Rust sources
        uses: actions/upload-artifact@v4
        with:
          name: generated-rust-${{ github.sha }}
          path: src/generated/*.rs
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated sources are current
        shell: bash
        run: |
          git diff --exit-code -- src/generated
          test -z "$(git status --porcelain --untracked-files=all -- src/generated)"

  rust:
    name: Rust tests and quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
