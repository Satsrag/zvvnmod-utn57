[package]
name = "zvvnmod-utn57"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "ZVVNMOD and UTN #57 written-form conversion primitives"
license = "Apache-2.0"
repository = "https://github.com/Satsrag/zvvnmod-utn57"
readme = "README.md"
keywords = ["mongolian", "unicode", "utn57", "zvvnmod"]
categories = ["text-processing", "internationalization"]

[lib]
name = "zvvnmod_utn57"
path = "src/lib.rs"

[[bin]]
name = "zvvnmod-to-utn57"
path = "src/bin/zvvnmod-to-utn57.rs"

[dependencies]
# Pure-Rust normalization backend. Cargo.lock pins the exact resolved release
# for reproducible application and CLI builds.
mongol-norm = "0.1.1"
